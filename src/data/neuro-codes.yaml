      icd10: ["G12.1"]

- group: Prion diseases
  conditions:
    - name: Prion disease, unspecified
      snomed: "20484008"
      icd10: ["A81.9"]
      icd11: ["8E0Z"]
    - name: Creutzfeldt-Jakob disease
      also: [CJD]
      snomed: "792004"
      icd10: ["A81.0"]
      icd11: ["8E00"]
      note: >-
        ICD-11 has no code for CJD of unspecified type; 8E00 is sporadic.
        Dementia in CJD is ICD-10 F02.1, ICD-11 6D85.5.
    - name: Sporadic Creutzfeldt-Jakob disease
      also: [sCJD]
      snomed: "713060000"
      icd10: ["A81.0"]
      icd11: ["8E00"]
    - name: Variant Creutzfeldt-Jakob disease
      also: [vCJD]
      snomed: "304603007"
      icd10: ["A81.0"]
      icd11: ["8E01.2"]

- group: Ataxias and other inherited conditions
  conditions:
    - name: Friedreich's ataxia
      also: [FRDA, Friedreich ataxia]
      snomed: "10394003"
      icd10: ["G11.1"]
      icd11: ["8A03.10"]
    - name: Spinocerebellar ataxia
      also: [SCA]
      snomed: "129609000"
      icd10: ["G11.2"]
      icd11: ["8A03.16"]
      note: "ICD-10 G11.2 is late-onset cerebellar ataxia; early-onset forms are G11.1."
    - name: Hereditary spastic paraplegia
      also: [HSP, Strümpell disease]
      snomed: "39912006"
      icd10: ["G11.4"]
      icd11: ["8B44.0"]
    - name: CADASIL
      also: [cerebral autosomal dominant arteriopathy with subcortical infarcts and leukoencephalopathy]
      snomed: "390936003"
      icd10: ["I67.8"]
      icd11: ["8B22.C0"]
