      icd11: ["8B60"]
    - name: Amyotrophic lateral sclerosis
      also: [ALS]
      snomed: "86044005"
      icd10: ["G12.2"]
      icd11: ["8B60.0"]
    - name: Primary lateral sclerosis
      also: [PLS]
      snomed: "81211007"
      icd10: ["G12.2"]
      icd11: ["8B60.4"]
    - name: Progressive muscular atrophy
      also: [PMA]
      snomed: "88923002"
      icd10: ["G12.2"]
      icd11: ["8B60.3"]
    - name: Progressive bulbar palsy
      also: [PBP]
      snomed: "54304004"
      icd10: ["G12.2"]
      icd11: ["8B60.1"]
    - name: Spinal muscular atrophy
      also: [SMA]
      snomed: "5262007"
      icd10: ["G12.9"]
      icd11: ["8B61"]
      note: "ICD-10 by type: G12.0 infantile type I, G12.1 other inherited."
    - name: Spinal and bulbar muscular atrophy
